name: Deploy Industry Idle Website

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt NodeJS
        uses: actions/setup-node@v4
        with:
          node-version: 16

      - name: Cài đặt và Dịch game
        run: |
          npm install
          npm run build --if-present

      - name: Đẩy bản web lên GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages